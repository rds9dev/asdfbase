services:
  # asdfbase Frontend & Proxy for Render
  - type: web
    name: asdfbase
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_TARGET
        value: https://api-asdf.rds9.net
